server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Loaded on every page load and rewritten at container start.
    location = /config.js {
        add_header Cache-Control "no-store";
    }

    # Single-page app: unknown paths fall through to the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
